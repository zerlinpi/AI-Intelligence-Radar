name: 自动测试

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

  workflow_dispatch:

env:
  TESTING: "true"
  DATABASE_URL: "sqlite:///:memory:"
  FEISHU_WEBHOOK: "https://open.feishu.cn/open-apis/bot/v2/hook/test-ci"
  FEISHU_OUTBOX_DIR: "/tmp/ai-radar-feishu-outbox"
  LLM_PROVIDER: "deepseek"
  LLM_API_KEY: "ci-placeholder"
  LLM_BASE_URL: "https://api.deepseek.com/v1"
  LLM_MODEL: "deepseek-v4-pro"
  LLM_MAX_TOKENS: "65536"
  LLM_TIMEOUT_SECONDS: "900"
  REPORT_TIMEZONE: "Asia/Shanghai"

jobs:
  test:
    name: 项目测试
    runs-on: ubuntu-latest

    steps:
      - name: 获取代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 显示 Python 版本
        run: python --version

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: 检查依赖完整性
        run: python -m pip check

      - name: 编译全部 Python 文件
        run: python -m compileall -q app scripts tests

      - name: 校验 Docker Compose
        run: |
          cp .env.example .env
          docker compose config >/dev/null
          rm -f .env

      - name: 生产预检 Smoke Test
        run: python -m app.cli check

      - name: 运行测试
        run: python -m pytest -v --tb=short
