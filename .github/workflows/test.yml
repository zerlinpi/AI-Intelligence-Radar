name: 自动测试

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

  workflow_dispatch:

env:
  TESTING: "true"
  DATABASE_URL: "sqlite:///:memory:"

jobs:
  test:
    name: 项目测试
    runs-on: ubuntu-latest

    steps:
      - name: 获取代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 显示 Python 版本
        run: python --version

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: 运行测试
        run: |
          python -m pytest -v --tb=short
