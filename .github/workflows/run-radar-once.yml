name: AI 情报雷达立即执行

# Retry marker: script import path fixed on this branch.
on:
  push:
    branches:
      - "ops/run-radar-once-20260908"
    paths:
      - ".github/workflows/run-radar-once.yml"

permissions:
  contents: read
  issues: read

env:
  PYTHONUNBUFFERED: "1"
  REPORT_TIMEZONE: "Asia/Shanghai"
  DATABASE_URL: "sqlite:///./data/radar.db"
  DATABASE_BACKUP_DIR: "./data/backups"
  RUN_HISTORY_FILE: "./data/run-history.json"
  FEISHU_OUTBOX_DIR: "./data/feishu-outbox"
  FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
  GITHUB_TOKEN: ${{ github.token }}
  CHATGPT_FEED_ISSUE: "2"

jobs:
  run-once:
    name: 立即发布今天的 ChatGPT Radar 卡片
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 获取代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 准备运行目录
        run: mkdir -p data data/backups data/feishu-outbox

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 立即发布今天的正式 Feed
        run: python scripts/send_chatgpt_feed.py
