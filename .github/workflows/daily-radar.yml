name: AI 情报雷达日报

on:
  # 07:45 的 ChatGPT 自动任务只负责把当天 Feed 写入 Issue #2。
  # 新 Feed 到达后启动本 Workflow，并在发送前等待到上海时间 08:00。
  # 不再使用 GitHub schedule，避免 cron 排队后在 10:42 等非预期时间重复发送。
  issue_comment:
    types: [created]
  # 仅保留人工恢复入口；不会自动触发第二次发布。
  workflow_dispatch:

permissions:
  contents: read
  issues: read

# 同一时间只允许一轮日报发布。若 08:00 前意外出现第二条符合条件的 Feed，
# 最新一轮替换仍在等待的旧轮次，避免两轮在 08:00 连续发送。
concurrency:
  group: ai-intelligence-radar-daily
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  REPORT_TIMEZONE: "Asia/Shanghai"
  DATABASE_URL: "sqlite:///./data/radar.db"
  DATABASE_BACKUP_DIR: "./data/backups"
  RUN_HISTORY_FILE: "./data/run-history.json"
  FEISHU_OUTBOX_DIR: "./data/feishu-outbox"
  FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
  GITHUB_TOKEN: ${{ github.token }}
  CHATGPT_FEED_ISSUE: "2"

jobs:
  daily-radar:
    # 自动发布只接受 Issue #2 新建且带 Radar Feed marker 的评论。
    # workflow_dispatch 仅用于明确的人工故障恢复。
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.number == 2 &&
       contains(github.event.comment.body, 'AI-INTELLIGENCE-RADAR-CHATGPT-FEED'))
    name: 发布 ChatGPT AI 情报日报
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 获取代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 恢复 Radar 状态
        id: radar-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: data
          key: radar-state-${{ runner.os }}-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            radar-state-${{ runner.os }}-v2-

      - name: 准备运行目录
        run: mkdir -p data data/backups data/feishu-outbox

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 检查依赖完整性
        run: python -m pip check

      - name: 等待到上海时间 08:00
        if: github.event_name == 'issue_comment'
        shell: bash
        run: |
          python - <<'PY'
          import time
          from datetime import datetime
          from zoneinfo import ZoneInfo

          tz = ZoneInfo("Asia/Shanghai")
          now = datetime.now(tz)
          target = now.replace(hour=8, minute=0, second=0, microsecond=0)

          if now < target:
              delay = (target - now).total_seconds()
              print(f"Feed 已就绪，等待 {delay:.0f} 秒到 {target.isoformat()} 后发布。")
              time.sleep(delay)
          else:
              print(f"当前已过 08:00（{now.isoformat()}），立即执行补发。")
          PY

      # 本 Workflow 不调用第二个 LLM；只把结构化 Feed 转成仓库现有的
      # ReportDecisionModel -> Card Builder -> app.feishu，因此飞书视觉和分页逻辑保持原样。
      - name: 发布当天 ChatGPT 情报分析
        id: radar-run
        shell: bash
        run: |
          set +e
          python scripts/send_chatgpt_feed.py 2>&1 | tee data/actions-run.log
          radar_exit=${PIPESTATUS[0]}
          echo "exit_code=${radar_exit}" >> "$GITHUB_OUTPUT"
          exit "${radar_exit}"

      - name: 写入 Actions 状态摘要
        if: always()
        shell: bash
        run: |
          {
            echo "## AI 情报雷达运行状态"
            echo
            echo "- 分析来源：ChatGPT Daily Radar Feed（Issue #${CHATGPT_FEED_ISSUE}）"
            echo "- 触发方式：${{ github.event_name }}"
            echo "- Workflow Run：${{ github.run_id }} / attempt ${{ github.run_attempt }}"
            echo "- 状态缓存精确命中：${{ steps.radar-cache-restore.outputs.cache-hit || 'false' }}"
            echo "- 发布退出码：${{ steps.radar-run.outputs.exit_code || '未执行到发布脚本' }}"
            echo
            if [ -f data/chatgpt-feed-status.json ]; then
              echo '```json'
              cat data/chatgpt-feed-status.json
              echo
              echo '```'
            else
              echo "未生成 ChatGPT Feed 状态文件。"
            fi
            echo
            echo "### 飞书 Outbox / Radar 状态"
            echo '```text'
            python -m app.cli status || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 即使飞书暂时不可用，也保留 Outbox 与运行状态，供明确的人工恢复使用。
      - name: 保存 Radar 状态缓存
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: radar-state-${{ runner.os }}-v2-${{ github.run_id }}-${{ github.run_attempt }}

      - name: 上传状态与日志备份
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: data
          if-no-files-found: warn
          retention-days: 30
