name: AI 情报雷达日报

on:
  # 常驻 APScheduler 是北京时间 08:00:00 主发布器。
  # GitHub Actions 仅做灾备：用两个很早的唤醒机会（北京时间 02:15 / 02:30），
  # 一旦 Runner 提前拿到资源，就等待到 08:04 再检查 delivery receipt。
  # 主服务已成功时直接退出；仅主服务未成功时由 Actions 补发。
  schedule:
    - cron: "15 18 * * *"
    - cron: "30 18 * * *"
  # 人工恢复默认仍受 08:00–08:10 窗口保护。
  # 只有明确勾选 force_send 才允许当天错过窗口后补发。
  workflow_dispatch:
    inputs:
      force_send:
        description: "仅故障恢复使用：允许当前日期在 08:10 后补发"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write

concurrency:
  group: ai-intelligence-radar-daily
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  REPORT_TIMEZONE: "Asia/Shanghai"
  DATABASE_URL: "sqlite:///./data/radar.db"
  DATABASE_BACKUP_DIR: "./data/backups"
  RUN_HISTORY_FILE: "./data/run-history.json"
  FEISHU_OUTBOX_DIR: "./data/feishu-outbox"
  FEISHU_INTER_CARD_DELAY_SECONDS: "1.2"
  FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
  GITHUB_TOKEN: ${{ github.token }}
  CHATGPT_FEED_ISSUE: "2"
  CHATGPT_FEED_AUTHOR: ${{ github.repository_owner }}
  RADAR_ENFORCE_SEND_WINDOW: "1"
  RADAR_SEND_WINDOW_START: "08:00"
  RADAR_SEND_WINDOW_END: "08:10"
  RADAR_ALLOW_LATE_RECOVERY: ${{ github.event_name == 'workflow_dispatch' && inputs.force_send && '1' || '0' }}
  RADAR_LOCAL_FALLBACK_PATH: "./data/local-fallback-cards.json"

jobs:
  daily-radar:
    name: 北京时间 08:04 灾备检查 AI 情报日报
    runs-on: ubuntu-latest
    # 最早 02:15 启动时需要在 Runner 内等待到 08:04 灾备检查。
    # GitHub hosted runner 单 job 上限 6 小时，因此这里使用最大安全窗口。
    timeout-minutes: 360

    steps:
      - name: 获取代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 恢复 Radar 状态
        id: radar-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: data
          key: radar-state-${{ runner.os }}-v5-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            radar-state-${{ runner.os }}-v5-

      - name: 准备运行目录
        run: mkdir -p data data/backups data/feishu-outbox

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 检查依赖完整性
        run: python -m pip check

      - name: 07:35 准备本地兜底
        id: fallback-prep
        shell: bash
        run: |
          python - <<'PY'
          import time
          from datetime import datetime
          from zoneinfo import ZoneInfo

          tz = ZoneInfo("Asia/Shanghai")
          now = datetime.now(tz)
          target = now.replace(hour=7, minute=35, second=0, microsecond=0)

          if now < target:
              delay = (target - now).total_seconds()
              print(f"当前 {now.isoformat()}，等待 {delay:.0f} 秒到本地兜底准备时间 {target.isoformat()}。")
              time.sleep(delay)
          else:
              print(f"当前 {now.isoformat()}，立即检查 ChatGPT Feed 并准备必要兜底。")
          PY
          set +e
          python scripts/prepare_local_fallback.py 2>&1 | tee data/fallback-prep.log
          fallback_exit=${PIPESTATUS[0]}
          echo "exit_code=${fallback_exit}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: 等待到北京时间 08:04 灾备检查
        shell: bash
        run: |
          python - <<'PY'
          import time
          from datetime import datetime
          from zoneinfo import ZoneInfo

          tz = ZoneInfo("Asia/Shanghai")
          now = datetime.now(tz)
          target = now.replace(hour=8, minute=4, second=0, microsecond=0)

          if now < target:
              delay = (target - now).total_seconds()
              print(f"当前 {now.isoformat()}，等待 {delay:.0f} 秒到 {target.isoformat()}。")
              time.sleep(delay)
          else:
              print(f"当前 {now.isoformat()}，由发送窗口保护决定是否允许发布。")
          PY

      - name: 发布当天 ChatGPT 情报分析
        id: radar-run
        shell: bash
        run: |
          set +e
          python scripts/send_chatgpt_feed.py 2>&1 | tee data/actions-run.log
          radar_exit=${PIPESTATUS[0]}
          echo "exit_code=${radar_exit}" >> "$GITHUB_OUTPUT"
          exit "${radar_exit}"

      - name: 写入 Actions 状态摘要
        if: always()
        shell: bash
        run: |
          {
            echo "## AI 情报雷达运行状态"
            echo
            echo "- 主发布时间：北京时间 08:00:00（常驻 APScheduler）"
            echo "- Actions 灾备检查：北京时间 08:04"
            echo "- 正常允许发送窗口：08:00–08:10"
            echo "- 人工强制恢复：${RADAR_ALLOW_LATE_RECOVERY}"
            echo "- 分析来源：ChatGPT Daily Radar Feed（Issue #${CHATGPT_FEED_ISSUE}）"
            echo "- 可信 Feed 作者：${CHATGPT_FEED_AUTHOR}"
            echo "- 触发方式：${{ github.event_name }}"
            echo "- Workflow Run：${{ github.run_id }} / attempt ${{ github.run_attempt }}"
            echo "- 状态缓存精确命中：${{ steps.radar-cache-restore.outputs.cache-hit || 'false' }}"
            echo "- 07:35 本地兜底准备退出码：${{ steps.fallback-prep.outputs.exit_code || '未执行' }}"
            echo "- 发布退出码：${{ steps.radar-run.outputs.exit_code || '未执行到发布脚本' }}"
            echo
            if [ -f data/chatgpt-feed-status.json ]; then
              echo '~~~json'
              cat data/chatgpt-feed-status.json
              echo
              echo '~~~'
            else
              echo "未生成 ChatGPT Feed 状态文件。"
            fi
            echo
            echo "### 飞书 Outbox / Radar 状态"
            echo '~~~text'
            python -m app.cli status || true
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 保存 Radar 状态缓存
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: radar-state-${{ runner.os }}-v5-${{ github.run_id }}-${{ github.run_attempt }}

      - name: 上传状态与日志备份
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: data
          if-no-files-found: warn
          retention-days: 30
